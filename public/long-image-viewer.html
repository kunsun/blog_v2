<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Long Image Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 16px;
  }
  .viewer {
    width: 100%;
    max-width: 800px;
    height: 500px;
    overflow-y: auto;
    overflow-x: hidden;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
    scrollbar-width: thin;
    scrollbar-color: #c1c1c1 transparent;
  }
  .viewer::-webkit-scrollbar { width: 6px; }
  .viewer::-webkit-scrollbar-track { background: transparent; }
  .viewer::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
  .viewer::-webkit-scrollbar-thumb:hover { background: #999; }
  .viewer img {
    display: block;
    width: 100%;
    height: auto;
  }
  .back-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #555;
    transition: opacity .2s;
  }
  .back-top:hover { background: #f0f0f0; }
</style>
</head>
<body>

<div class="viewer">
  <img id="img" alt="Long Image">
</div>
<button class="back-top" id="backTop" onclick="document.querySelector('.viewer').scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
  const url = new URLSearchParams(location.search).get('img');
  if (url) document.getElementById('img').src = url;
  const viewer = document.querySelector('.viewer');
  const btn = document.getElementById('backTop');
  viewer.addEventListener('scroll', () => {
    btn.style.display = viewer.scrollTop > 300 ? 'flex' : 'none';
  });
</script>

</body>
</html>
