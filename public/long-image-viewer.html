<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Long Image Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 16px;
  }
  .viewer {
    width: 100%;
    max-width: 800px;
    height: 500px;
    overflow-y: auto;
    overflow-x: hidden;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
    scrollbar-width: thin;
    scrollbar-color: #c1c1c1 transparent;
  }
  .viewer::-webkit-scrollbar { width: 6px; }
  .viewer::-webkit-scrollbar-track { background: transparent; }
  .viewer::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
  .viewer::-webkit-scrollbar-thumb:hover { background: #999; }
  .viewer img {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>

<div class="viewer">
  <img id="img" alt="Long Image">
</div>
<script>
  const url = new URLSearchParams(location.search).get('img');
  if (url) document.getElementById('img').src = url;
</script>

</body>
</html>
